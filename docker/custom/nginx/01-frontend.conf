# Proxy the SvelteKit UI to the internal adapter-node service. The public
# path and port are rendered from the environment at startup (defaults in
# docker/custom/env/10-service.env), so a deployment can move the UI without
# rebuilding the image.
location ${PUBLIC_API_BASE_URL}/ {
    proxy_pass http://127.0.0.1:${NODE_SERVICE_PORT};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT};
    proxy_read_timeout ${NGINX_PROXY_READ_TIMEOUT};
    proxy_send_timeout ${NGINX_PROXY_SEND_TIMEOUT};
}
