services:
  crawler:
    build:
      context: .
      dockerfile: Dockerfile
    image: crawl4ai-fastapi:latest
    container_name: crawl4ai-service
    ports:
      - "8004:8000"
    environment:
      # Optional API security token
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:-}
      # Maximum concurrent crawl tasks
      - MAX_CONCURRENT_TASKS=${MAX_CONCURRENT_TASKS:-5}
      # Server configuration
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      # Optional LLM Provider Keys (for advanced crawl4ai features)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Redis Pub/Sub Configuration (recommended)
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_CHANNEL=${REDIS_CHANNEL:-scrape-events}
      # WebSocket URL for real-time events (legacy, deprecated)
      # Example: ws://laravel-app:6001 for Laravel WebSocket
      - WEBSOCKET_URL=${WEBSOCKET_URL:-}
      # Data storage path for job files
      - DATA_PATH=${DATA_PATH:-/app/data/jobs}
    volumes:
      # Mount data directory for job-specific storage (new structure)
      - ./data:/app/data
      # Mount output directory for backwards compatibility
      - ./output:/app/output
      # Shared memory for Playwright (prevents crashes)
      - /dev/shm:/dev/shm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

networks:
  default:
    name: hawki-network
    external: true
