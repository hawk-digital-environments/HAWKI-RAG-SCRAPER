# Deploys the scraper to the testing instance, following the pattern of the
# HAWKI and HAWKI-RAG deploy pipelines:
#
#   1. The single scraper image is built for linux/amd64 and pushed to
#      ghcr.io, tagged test-1-<sha> and test-1-latest.
#   2. The Dokploy webhook for the instance is triggered; the central Dokploy
#      instance then deploys the stack onto the machine over SSH and pulls
#      the freshly pushed image.
#
# This pipeline is decoupled from publish-version.yml, which publishes the
# public multi-arch release image to Docker Hub.
#
# The scraper has a single testing instance, so the tag and webhook suffix
# are fixed to "1" - matching the DOKPLOY_DEPLOYMENT_WEBHOOK_TEST_1 secret.
# A second instance would reintroduce the setup job and the instance choice
# input of the HAWKI testing pipeline.
name: Deploy Scraper to Testing

on:
  workflow_dispatch:
  push:
    branches:
      - 'hawk/test-1'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Check out the deploy ref
        uses: actions/checkout@v7
        with:
          # Always deploy hawk/test-1, no matter which ref the workflow was
          # dispatched from: the "Use workflow from" dropdown of a manual
          # run only picks which workflow file runs and defaults to
          # development, it does not pick the deployed code.
          ref: hawk/test-1

      # github.sha belongs to the ref the workflow was dispatched from, not
      # to hawk/test-1, so resolve the actually checked-out commit for the
      # image tags below.
      - name: Resolve the deployed commit
        id: build_info
        run: echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=test-1-${{ steps.build_info.outputs.head_sha }}
            type=raw,value=test-1-latest

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SvelteKit/Vite inline PUBLIC_* values into the bundle at build
          # time, so the UI base path has to be injected as a build arg. The
          # default lives in the Dockerfile (/ui); set the repository
          # variable PUBLIC_API_BASE_URL to deploy under a different path.
          build-args: |
            PUBLIC_API_BASE_URL=${{ vars.PUBLIC_API_BASE_URL || '/ui' }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Trigger Dokploy webhook
        run: curl -fsSL "${{ secrets.DOKPLOY_DEPLOYMENT_WEBHOOK_TEST_1 }}"

  remove-old-images:
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: snok/container-retention-policy@v3.1.0
        with:
          account: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: "customcrawler"
          image-tags: "test-1-* !test-1-latest"
          keep-n-most-recent: 5
          cut-off: 1h
