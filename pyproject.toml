[project]
name = "HAWKICrawler"
version = "0.0.1"
description = "Crawler for HAWKI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aio-pika~=9.6.2",
    "aiofiles~=25.1.0",
    "aiohttp~=3.13.5",
    "beautifulsoup4~=4.14.3",
    "chardet<6",
    "crawl4ai~=0.8.6",
    "fastapi~=0.136.1",
    "html2text~=2025.4.15",
    "lxml~=5.4.0",
    "pydantic~=2.13.4",
    "python-dotenv~=1.2.2",
    "python-multipart~=0.0.29",
    "uvicorn[standard]~=0.47.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "*_validation.py"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s %(asctime)s %(name)s %(message)s"
log_cli_date_format = "%H:%M:%S"

[dependency-groups]
dev = [
    "pytest~=9.0.3",
    "pytest-asyncio>=1.2dev",
    "pyhamcrest~=2.1.0",
]
